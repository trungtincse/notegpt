name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist-script: dist
          - os: windows-latest
            dist-script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @notegpt/core build
      - run: pnpm --filter @notegpt/editor-ui build
      - run: pnpm --filter @notegpt/desktop ${{ matrix.dist-script }}

      - uses: actions/upload-artifact@v4
        with:
          name: notegpt-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.exe
          if-no-files-found: error

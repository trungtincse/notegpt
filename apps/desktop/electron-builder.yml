appId: com.notegpt.desktop
productName: NoteGPT
executableName: NoteGPT
directories:
  output: dist
  buildResources: build
afterPack: build/afterPack.cjs
files:
  - out/**/*
  - resources/**/*
  - package.json
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: notegpt
  icon: build/icons
  artifactName: "${productName}-${version}-${arch}.${ext}"
deb:
  afterInstall: build/postinstall.sh
  afterRemove: build/postremove.sh
win:
  target:
    - nsis
  artifactName: "${productName}-${version}-setup.${ext}"
